# Portable project dependencies, not an exact platform-specific lockfile.
name: phase_diversity_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy>=2,<3
  - scipy>=1.14,<2
  - matplotlib>=3.9,<4
  - pandas>=2,<4
  - ipykernel>=6,<8
  - jupyterlab>=4,<5
  - pillow
  - pip
